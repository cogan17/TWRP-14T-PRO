name: Arsip semua versi (sekali pakai)

# Button (owner, 7 Nov 2026): before the release files are removed, collect every TWRP and OrangeFox
# version into six archives for the owner's own backup: package zips, recovery images, stock vendor_boot.
# Kept as artifacts for 14 days (the repo is public); names start with ARSIP- so the cleanup button's
# "paket" option leaves them alone.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  arsip:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - name: Kumpulkan / Collect
        run: |
          mkdir -p dl a/{TWRP,OrangeFox}-{paket,img,stok}
          # every release: <tag> <file>; tags v* are TWRP, ofox-v* OrangeFox
          gh api --paginate "repos/$R/releases?per_page=100" --jq '.[].tag_name' | sort -V > tags.txt
          while read -r tag; do
            gh release download "$tag" -R "$R" -D "dl/$tag"
          done < tags.txt
          # the newest packages exist only as Verify artifacts (shared on Telegram, never released)
          for p in TWRP OrangeFox; do
            id=$(gh api "repos/$R/actions/artifacts?name=PAKET-$p-rothko-OS3.0.302.0.WNNIDXM&per_page=10" --jq '[.artifacts[] | select(.expired | not)][0].id // empty')
            [ -n "$id" ] || { echo "::error::no PAKET-$p artifact"; exit 1; }
            ver=$([ $p = TWRP ] && grep -m1 -oE '^## v[0-9.]+' <(gh api "repos/$R/contents/CHANGELOG.md" -H 'Accept: application/vnd.github.raw') \
                              || grep -m1 -oE '^## ofox-v[0-9.]+' <(gh api "repos/$R/contents/CHANGELOG-orangefox.md" -H 'Accept: application/vnd.github.raw'))
            ver=${ver#\#\# }
            [ ! -e "dl/$ver" ] || { echo "::error::$ver is already a release"; exit 1; }
            mkdir -p "dl/$ver"
            gh api "repos/$R/actions/artifacts/$id/zip" > "dl/$ver/PAKET-$p-rothko-OS3.0.302.0.WNNIDXM.zip"
            # only this product's image and the stock one (the OrangeFox package also carries a TWRP image)
            unzip -q -j "dl/$ver/PAKET-$p-rothko-OS3.0.302.0.WNNIDXM.zip" "$p-rothko-*.img" 'STOK-*.img' -d "dl/$ver"
            echo "$ver" >> tags.txt
          done
          # sort into the six archives; version in every name, stock once per firmware
          for d in dl/*/; do
            tag=$(basename "$d"); p=$([[ $tag == ofox-* ]] && echo OrangeFox || echo TWRP)
            for f in "$d"*; do
              n=$(basename "$f")
              case "$n" in
                PAKET-*.zip) mkdir -p "a/$p-paket/$tag" && mv "$f" "a/$p-paket/$tag/" ;;
                STOK-*.img)  [ -e "a/$p-stok/$n" ] || mv "$f" "a/$p-stok/" ;;
                *.img)       mv "$f" "a/$p-img/${n%%-rothko-*}-$tag-${n#*-rothko-}" ;;
              esac
            done
          done
          for x in a/*/; do (cd "$x" && find . -type f ! -name SHA256SUMS.txt | sort -V | xargs sha256sum > SHA256SUMS.txt); done
          {
            echo "## 📦 Arsip semua versi"
            echo "Versi: $(sort -V tags.txt | tr '\n' ' ')"
            echo
            for x in a/*/; do echo "### $(basename "$x")"; echo '```'; cat "$x/SHA256SUMS.txt"; echo '```'; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with: { name: ARSIP-TWRP-paket, path: a/TWRP-paket/, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        with: { name: ARSIP-TWRP-img, path: a/TWRP-img/, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        with: { name: ARSIP-TWRP-stok-vendor_boot, path: a/TWRP-stok/, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        with: { name: ARSIP-OrangeFox-paket, path: a/OrangeFox-paket/, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        with: { name: ARSIP-OrangeFox-img, path: a/OrangeFox-img/, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        with: { name: ARSIP-OrangeFox-stok-vendor_boot, path: a/OrangeFox-stok/, retention-days: 14 }
