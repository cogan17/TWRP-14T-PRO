name: Build OrangeFox (rothko)

# OrangeFox fox_16.0 with the same device tree; Verify splits and gates the image like TWRP's
on:
  push:
    branches: [orangefox]
    paths-ignore: ['**.md', 'docs/**', 'arsip/**', 'release/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        # explicit bash adds pipefail; without it a failed `mka | tee` passed as success
        shell: bash
    steps:
      # No loop-backed LVM (maximize-build-space): heavy I/O + memory pressure on it hung the VM
      # three times ("runner lost communication"). Use the real / and /mnt disks instead.
      - name: Prepare disks, swap and memory cap
        run: |
          sudo swapoff -a && sudo rm -f /mnt/swapfile
          # source alone is ~77 GB, so drop every preinstalled toolchain the build does not use
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /usr/share/swift /opt/microsoft /opt/google /opt/az /usr/local/julia*
          sudo docker image prune -a -f >/dev/null || true
          r=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          m=$(df -BG --output=avail /mnt | tail -1 | tr -dc 0-9)
          echo "::notice title=Disk after cleanup::/ ${r}G free, /mnt ${m}G free"
          # source (~50 GB) on one disk, out/ and swap on the other. Both disks normally have ~120 GB
          if [ "$m" -ge 100 ] || [ "$m" -ge "$r" ]; then src=/mnt/twrp; out=/out; swap=/swapfile
          else src=/twrp; out=/mnt/out; swap=/mnt/swapfile; fi
          sudo mkdir -p "$src" "$out" && sudo chown "$USER" "$src" "$out"
          # swap is made after the sync, sized from what the source leaves free
          echo "SRC=$src" >> "$GITHUB_ENV"
          echo "SWAP=$swap" >> "$GITHUB_ENV"
          echo "OUT_DIR=$out" >> "$GITHUB_ENV"
          # sync and build join this cgroup, so the runner agent always keeps RAM
          # and an OOM kills only our processes
          sudo mkdir /sys/fs/cgroup/build
          # soong_build was OOM-killed at 12G; leave the runner just 1 GiB
          echo $(( ($(awk '/MemTotal/{print $2}' /proc/meminfo) - 1048576) * 1024 )) | sudo tee /sys/fs/cgroup/build/memory.max
          free -h

      - name: Install build tools
        run: |
          # runner apt mirrors flake now and then
          for i in 1 2 3; do sudo apt-get -o Acquire::Retries=3 update && break; sleep 15; done
          sudo apt-get -o Acquire::Retries=3 install -y bc bison build-essential curl flex git gnupg gperf libssl-dev \
            libxml2-utils lz4 python-is-python3 rsync unzip xsltproc zip zlib1g-dev zstd cpio
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name github-actions
          git config --global user.email github-actions@users.noreply.github.com

      - uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Sync OrangeFox 16.0 manifest
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/build/cgroup.procs >/dev/null
          cd "$SRC"
          # official route (gitlab.com/OrangeFox/sync README): complete manifest, no local patches
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0
          # Android 16 soong_build was OOM-killed analysing the full tree: drop projects a recovery
          # never builds (cloud SDKs, ML, car apps, kernel prebuilts, the Mondrian reference tree)
          mkdir -p .repo/local_manifests
          { echo '<?xml version="1.0" encoding="UTF-8"?>'; echo '<manifest>'
            sed 's|.*|  <remove-project name="&" optional="true" />|' "$GITHUB_WORKSPACE/device-tree/.github/ofox-remove-projects.txt"
            echo '</manifest>'; } > .repo/local_manifests/rothko-trim.xml
          repo sync -c -j"$(nproc --all)" --no-clone-bundle --no-tags --optimized-fetch --prune
          echo "::notice title=OrangeFox sources::recovery $(git -C bootable/recovery log -1 --format='%h %cd' --date=short); vendor/recovery $(git -C vendor/recovery log -1 --format='%h %cd' --date=short)"
          # reference ABI dumps only feed optional ABI checks (skipped when missing); frees space for swap
          rm -rf prebuilts/abi-dumps
          # leave ~30 GB for out/, the rest (16-40 GB) becomes swap for soong_build
          f=$(df -BG --output=avail "$(dirname "$SWAP")" | tail -1 | tr -dc 0-9)
          n=$(( f - 30 )); [ $n -gt 40 ] && n=40; [ $n -lt 16 ] && n=16
          sudo fallocate -l ${n}G "$SWAP" && sudo chmod 600 "$SWAP" && sudo mkswap "$SWAP" >/dev/null && sudo swapon "$SWAP"
          echo "::notice title=Swap::${n}G (${f}G was free after sync)"
          echo "::notice title=Disk after sync::$(df -h --output=avail / | tail -1) free; biggest: $(du -sh .repo prebuilts/* external/* 2>/dev/null | sort -h | tail -6 | tr '\t\n' ' ;')"

      - name: Build vendor_boot.img
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/build/cgroup.procs >/dev/null
          mkdir -p "$SRC/device/xiaomi"
          cp -a device-tree "$SRC/device/xiaomi/rothko"
          cd "$SRC"
          # only the zstd ramdisk patch: the others fix TWRP 14.1 sources, which OrangeFox replaces
          for p in device/xiaomi/rothko/patches/build_make/*.patch; do git -C build/make apply "$SRC/$p"; done
          {
            export ALLOW_MISSING_DEPENDENCIES=true FOX_BUILD_DEVICE=rothko
            source build/envsetup.sh
            lunch twrp_rothko-bp2a-eng
            echo "::notice title=OrangeFox settings::$(env | grep -E '^(FOX|OF)_' | sort | tr '\n' ' ')"
            # -k: keep going past the first failure so one run reports every broken file
            mka vendorbootimage -k
            # TWRP's relink lists lag behind vold (keystore2-V1 vs V4, ...) and copy the bootstrap
            # servicemanager: fill the gaps in recovery/root, then repack if anything changed
            # not fatal here: the verify workflow's gate decides, and it reruns in minutes, not hours
            fixed=$(python3 device/xiaomi/rothko/.github/scripts/recovery_deps.py "$OUT/recovery/root" \
              "$OUT/system/lib64" "$OUT/system_ext/lib64" "$OUT/vendor/lib64" "$OUT_DIR/soong/.intermediates") ||
              echo "::warning title=Recovery deps::some libraries were not found in the build output"
            if [ -n "$fixed" ]; then
              echo "::notice title=Added to recovery::$(echo "$fixed" | tr '\n' ';')"
              rm -rf "$OUT"/vendor_boot.img "$OUT"/vendor_ramdisk*.img "$OUT"/obj/PACKAGING/vendor_boot_intermediates
              mka vendorbootimage
            fi
          } 2>&1 | tee "$OUT_DIR/build.log"
          cd "$OUT_DIR/target/product/rothko"
          sha256sum vendor_boot.img | tee vendor_boot.img.sha256
          echo "::notice title=vendor_boot.img::$(stat -c%s vendor_boot.img) bytes, sha256 $(cut -d' ' -f1 vendor_boot.img.sha256)"

      # Surface the compiler error as an annotation so it is readable without downloading logs
      - name: Report build error
        if: failure()
        run: |
          f="$OUT_DIR/error.log"
          [ -s "$f" ] || f="$OUT_DIR/build.log"
          [ -s "$f" ] || exit 0
          msg=$(tail -c 3500 "$f" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build error::$msg"
          # link failures: every missing symbol, not only the tail that fits above
          u=$(grep -o 'undefined symbol: [^ ]*' "$f" | cut -d' ' -f3 | sort -u | c++filt | head -80 | tr '\n' ';' || true)
          [ -z "$u" ] || echo "::error title=Undefined symbols::$u"
          e=$(sed 's/\x1b\[[0-9;]*m//g' "$f" | grep -E ': (fatal )?error: ' | sort -u | head -40 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' || true)
          [ -z "$e" ] || echo "::error title=All compile errors::$e"
          echo "::notice title=Disk at failure::$(df -h --output=target,avail / /mnt | tail -n +2 | tr -s ' ' | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: ofox-rothko-vendor_boot-${{ github.run_number }}
          path: |
            ${{ env.OUT_DIR }}/target/product/rothko/vendor_boot.img
            ${{ env.OUT_DIR }}/target/product/rothko/vendor_boot.img.sha256
